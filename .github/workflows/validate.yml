                  unknown = {'failures': 0, 'native_suffix_failures': 0}
                  keys = {'failures', 'upper_damage', 'checked', 'context', 'prepared_difference', 'native_suffix_failures'}
                  for context in contexts:
                      if type(context) is not dict or set(context) - keys or 'failures' not in context:
                          return {'status': 'context_shape_mismatch'}
                      for field in found:
                          values = context.get(field, [])
                          if type(values) is not list or len(values) > 256 or any(type(value) is not str for value in values):
                              return {'status': 'failure_list_shape_mismatch'}
                          for value in values:
                              if value in allowed_codes:
                                  found[field].add(value)
                              else:
                                  unknown[field] += 1
                  return {'status': 'classified', 'context_count': len(contexts),
                          'codes': {field: sorted(values) for field, values in found.items()},
                          'unknown_code_counts': unknown}
              marker = 'PRIVATE_VALUE_MUST_NOT_LEAVE'
              case = sorted(public_ids)[0]
              synthetic = ('Traceback (most recent call last):\n  File "' + prefix +
                           'engine/engine.py", line 80, in ' + marker +
                           '\n  File "' + prefix + marker + '.py", line 1, in secret\nValueError: ' + marker)
              sample = reduce(case + ' (value=' + marker + ')', synthetic, {'engine/engine.py'}, lambda path: 100)
              assert sample['test_ids'] == [case] and sample['frames'] == [{'path': 'engine/engine.py', 'line': 80}]
              assert sample['exception_type'] == 'ValueError' and marker not in json.dumps(sample)
              assert not reduce(marker, synthetic, set(), lambda path: 0)['test_ids']
              assert not reduce(case + marker, synthetic, {'engine/engine.py'}, lambda path: 100)['test_ids']
              assert not reduce(case, synthetic, {'engine/engine.py'}, lambda path: 79)['frames']
              assert not reduce(case, synthetic.replace(prefix, 'C:/private/'), {'engine/engine.py'}, lambda path: 100)['frames']
              assert reduce(case, marker + ': private', set(), lambda path: 0)['exception_type'] == 'unclassified'
              holder = case.rsplit('.', 1)[0]
              assert reduce('setUpClass (' + holder + ')', '', set(), lambda path: 0)['test_ids'] == sorted(name for name in public_ids if name.startswith(holder + '.'))
              for name in pending_types:
                  assert pending_type(name + ': ' + marker) == name
              assert pending_type(marker + ': private') == 'unclassified'
              assert pending_type('heavy_injury_adapter.HeavyPending: ' + marker + '\nRuntimeError: ' + marker) == 'unclassified'
              assert pending_type('heavy_injury_adapter.HeavyPending: ' + marker + '\npassive_events.PassiveEventPending: ' + marker) == 'passive_events.PassiveEventPending'
              heavy_sample = heavy_codes('AssertionError: ' + repr([{
                  'failures': ['attacker:custom_conditions', 'actor:nonpassive_state:' + marker, 'native_suffix_custom_condition' + marker],
                  'native_suffix_failures': ['native_suffix_custom_condition'],
                  'upper_damage': 123, 'checked': [marker], 'context': marker,
                  'prepared_difference': {'private': marker}}]))
              assert heavy_sample['status'] == 'classified' and heavy_sample['context_count'] == 1
              assert heavy_sample['codes'] == {'failures': ['attacker:custom_conditions'], 'native_suffix_failures': ['native_suffix_custom_condition']}
              assert heavy_sample['unknown_code_counts'] == {'failures': 2, 'native_suffix_failures': 0}
              assert marker not in json.dumps(heavy_sample) and 'upper_damage' not in heavy_sample
              assert heavy_codes('AssertionError: not_a_literal()') == {'status': 'not_supported_literal'}
              assert heavy_codes('AssertionError: ' + repr([marker])) == {'status': 'context_shape_mismatch'}
              assert heavy_codes('AssertionError: ' + 'x' * 65537) == {'status': 'payload_bound_exceeded'}

              # shortcut: this exact completed full1252 failure only; review before another run.
              with zipfile.ZipFile(temporary / 'diagnostics.zip') as archive:
                  entries = archive.infolist()
                  names = [item.filename for item in entries]
                  verifier_logs = [name for name in names if re.fullmatch(r'verifier/tests-[0-9a-f]{32}\.log', name)]
                  verifier_reports = [name for name in names if re.fullmatch(r'verifier/tests-[0-9a-f]{32}\.json', name)]
                  fixed = {'command.log', 'fixture-decrypt.log', 'marksman-source-parser.log',
                           'marksman-source-page-0329.log', 'marksman-source-candidate.log',
                           'marksman-source-provenance.log', 'physical/ci-native-events.jsonl',
                           'physical/ci-native-partial.log', 'physical/ci-native.log',
                           'physical/ci-native.json', 'diagnostic-scope.json'}
                  if (len(verifier_logs) != 1 or len(verifier_reports) != 1
                          or verifier_logs[0][:-4] != verifier_reports[0][:-5]
                          or len(entries) != 13 or len(set(names)) != 13
                          or set(names) != fixed | set(verifier_logs) | set(verifier_reports)
                          or sum(item.file_size for item in entries) > 33554432
                          or any(item.is_dir() or item.flag_bits & 1 or (item.external_attr >> 16) & 0o170000 == 0o120000 for item in entries)):
                      raise ValueError('Bounded diagnostic archive required')
                  scope_info = archive.getinfo('diagnostic-scope.json')
                  if scope_info.file_size > 4096:
                      raise ValueError('Bounded diagnostic scope metadata required')
                  scope = json.loads(archive.read(scope_info))
                  if (set(scope) != {'schema_version', 'kind', 'complete_input_capture', 'full_evidence', 'excluded_input_archives'}
                          or scope['schema_version'] != 1 or scope['kind'] != 'diagnostic_only'
                          or scope['complete_input_capture'] is not False or scope['full_evidence'] != full_evidence
                          or set(scope['excluded_input_archives']) != {'physical/ci-native-inputs.zip'}
                          or re.fullmatch(r'[0-9a-f]{64}', scope['excluded_input_archives']['physical/ci-native-inputs.zip']) is None):
                      raise ValueError('Original diagnostic scope differs')
                  report_info = archive.getinfo(verifier_reports[0])
                  if report_info.file_size > 8388608:
                      raise ValueError('One bounded original verifier report required')
                  report = json.loads(archive.read(report_info))
              if (report['kind'] != 'run' or report['successful'] is not False
                      or len(report['collected']) != 1252 or set(report['collected']) != public_ids
                      or report['tests_run'] != 1252 or report['discovery_errors']
                      or report['skipped'] or report['expected_failures'] or report['unexpected_successes']
                      or len(report['failures']) != 13 or len(report['errors']) != 53):
                  raise ValueError('Original completed full1252 report differs')
              reduced = []
              failing_ids, error_ids = set(), set()
              pending_classified, ordinary_payload_rows = [], 0
              for kind, status, target_ids in (('failures', 'fail', failing_ids), ('errors', 'error', error_ids)):
                  for row in report[kind]:
                      if (not isinstance(row, dict) or not isinstance(row.get('id'), str) or len(row['id']) > 65536
                              or not isinstance(row.get('traceback'), str) or len(row['traceback']) > 2097152):
                          raise ValueError('Bounded original failure row required')
                      item = reduce(row['id'], row['traceback'], tracked, line_count)
                      if not item['test_ids'] or any(public_status[name] != status for name in item['test_ids']):
                          raise ValueError('Original failure row public mapping differs')
                      frame_keys = {(frame['path'], frame['line']) for frame in item['frames']}
                      if kind == 'errors' and any(name in pending_ids for name in item['test_ids']):
                          if (len(item['test_ids']) != 1 or item['exception_type'] != 'unclassified'
                                  or ('engine/reactive_ability_events.py', 126) not in frame_keys):
                              raise ValueError('Exact pending exception row/frame differs')
                          item['exception_type'] = pending_type(row['traceback'])
                          item['public_pending_class_matched'] = item['exception_type'] in pending_types
                          pending_classified.extend(item['test_ids'])
                      if kind == 'failures' and ordinary_id in item['test_ids']:
                          if (item['test_ids'] != [ordinary_id] or item['exception_type'] != 'AssertionError'
                                  or ('tools/test_enduring_soul_native_resume.py', 42) not in frame_keys
                                  or ('engine/heavy_standard_adapter.py', 375) not in frame_keys):
                              raise ValueError('Exact ordinary Heavy assertion row/frame differs')
                          item['heavy_failure_identifiers'] = heavy_codes(row['traceback'])
                          ordinary_payload_rows += 1
                      target_ids.update(item['test_ids'])
                      reduced.append(dict(kind=kind, **item))
              if len(pending_classified) != 3 or set(pending_classified) != pending_ids or ordinary_payload_rows != 2:
                  raise ValueError('Exact Heavy diagnostic extension scope differs')
              if (len(failing_ids) != 9 or len(error_ids) != 41 or failing_ids & error_ids
                      or failing_ids != {name for name, status in public_status.items() if status == 'fail'}
                      or error_ids != {name for name, status in public_status.items() if status == 'error'}):
                  raise ValueError('Original unique failure mapping differs')
              result = dict(kind='redacted_original_full1252_failure_frames_only', source_run=40499062622,
                            source_job=122171859011, source_attempt=1, declared_public_id_count=1252,
                            original_public_packet_blob_oid=packet_blob,
                            source_commit=head, diagnostic_commit=os.environ['GITHUB_SHA'],
                            evidence_id=evidence_id, game_runs=0, native_reruns=0, verifier_reruns=0, h_reruns=0,
                            clause_credit=0, ordinary_verified=0, self_check_passed=True, physical_acceptance=False,
                            original_input_maps_compared_equal=True, original_h_status='H_REJECTED',
                            original_verifier_status='fail', original_verifier_exit_code=1, original_report_count=1,
                            original_tests_run=1252, original_unique_pass=1202, original_unique_fail=9, original_unique_error=41,
                            raw_failure_rows=13, raw_error_rows=53, diagnostic_not_new_test_evidence=True,
                            full1252_repair_scope_still_pending=True, failures=reduced,
                            diagnostic_extension='heavy_static_identifiers_v1', public_pending_rows=3,
                            ordinary_heavy_payload_rows=2, reviewed_failure_code_count=len(allowed_codes),
                            unknown_code_values_disclosed=False)
              with (root / 'aa-diagnostics.json').open('x', encoding='utf-8') as stream:
                  json.dump(result, stream, ensure_ascii=False, indent=2)

          try:
              main()
          except BaseException:
              print('Bounded diagnostic reduction failed; raw evidence remains private.')
              raise SystemExit(1)
          print('Redacted original full1252 failure frames saved; native/verifier/H reruns=0, clause credit=0.')
          '@
          python -I -B -X utf8 -c $taskCode
