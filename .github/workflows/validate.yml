name: Validate implementation workflow

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Reviewed synthetic tooling or frozen AA native validation; no clause credit
        type: choice
        required: true
        default: workflow_checks
        options:
          - workflow_checks
          - ci_adapter_checks
          - aa_native

permissions:
  contents: read

jobs:
  workflow_checks:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'workflow_checks' &&
      startsWith(github.ref, 'refs/heads/codex/implementation-workflow-')
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run unchanged synthetic tooling regressions
        shell: pwsh
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-workflow-checks' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $taskCode = @'
          from hashlib import sha256
          import json, os
          from pathlib import Path
          import sys, unittest
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          if root.drive.upper() != 'D:':
              raise RuntimeError('Synthetic test outputs must remain on D:')
          names = ['acceptance_evidence.py', 'reconcile_batch.py', 'audit_vault_quality.py',
                   'verify_ordered_core.py', 'test_acceptance_capture.py',
                   'test_reconcile_csv_core.py', 'test_verify_ordered_publication.py']
          paths = ['work/reuse-partials/' + name for name in names] + ['tools/report_category2_progress.py']
          before = {name: sha256((root/name).read_bytes()).hexdigest() for name in paths}
          sys.path.insert(0, str(root/'work/reuse-partials'))
          import reconcile_batch
          reconcile_batch.R = root
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'test_acceptance_capture', 'test_reconcile_csv_core', 'test_verify_ordered_publication'])
          declared = suite.countTestCases()
          if declared != 75:
              raise RuntimeError(f'Expected the retained 74 plus one module-name regression, got {declared}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          after = {name: sha256((root/name).read_bytes()).hexdigest() for name in paths}
          passed = result.wasSuccessful() and result.testsRun == declared and before == after
          evidence = dict(scope='synthetic_tooling_only', clause_credit=0, game_runs=0,
                          git_sha=os.environ['GITHUB_SHA'], declared=declared, ran=result.testsRun,
                          failures=len(result.failures), errors=len(result.errors),
                          skipped=len(result.skipped), passed=passed,
                          input_sha256=before, inputs_unchanged=before == after)
          with (root/'workflow-checks.json').open('x', encoding='utf-8') as stream:
              json.dump(evidence, stream, ensure_ascii=False, indent=2)
          raise SystemExit(0 if passed else 1)
          '@
          python -B -X utf8 -c $taskCode 2>&1 | Tee-Object -FilePath workflow-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve synthetic checks and exact source pins
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-workflow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workflow-checks.json
            workflow-checks.log
          if-no-files-found: error
          retention-days: 14

  ci_adapter_checks:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'ci_adapter_checks' &&
      startsWith(github.ref, 'refs/heads/codex/implementation-workflow-')
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run retained adapter self-check with synthetic private-policy boundaries
        shell: pwsh
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-adapter-checks' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          $taskPaths = @('tools/ci_validate.py', 'tools/ci_physical.py', 'tools/ci_physical_selfcheck.py', 'tools/ci_fixtures.mjs')
          $taskBefore = [ordered]@{}
          foreach ($taskPath in $taskPaths) { $taskBefore[$taskPath] = (Get-FileHash -Algorithm SHA256 -LiteralPath $taskPath).Hash.ToLowerInvariant() }
          $taskClock = [Diagnostics.Stopwatch]::StartNew()
          python -B -X utf8 tools/ci_validate.py --self-check 2>&1 | Tee-Object -FilePath ci-adapter-checks.log
          $taskExit = $LASTEXITCODE
          $taskClock.Stop()
          $taskAfter = [ordered]@{}
          foreach ($taskPath in $taskPaths) { $taskAfter[$taskPath] = (Get-FileHash -Algorithm SHA256 -LiteralPath $taskPath).Hash.ToLowerInvariant() }
          $taskUnchanged = ($taskBefore | ConvertTo-Json -Compress) -ceq ($taskAfter | ConvertTo-Json -Compress)
          $taskResult = [ordered]@{
            scope = 'synthetic_ci_adapter_self_check_only'
            clause_credit = 0
            game_runs = 0
            actual_private_policy_used = $false
            git_sha = $env:GITHUB_SHA
            exit_code = $taskExit
            elapsed_seconds = $taskClock.Elapsed.TotalSeconds
            input_sha256 = $taskBefore
            inputs_unchanged = $taskUnchanged
            passed = ($taskExit -eq 0 -and $taskUnchanged)
          }
          $taskResult | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath ci-adapter-checks.json -Encoding utf8NoBOM
          if (-not $taskResult.passed) { exit 1 }
      - name: Preserve synthetic adapter result and exact source pins
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-adapter-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-adapter-checks.json
            ci-adapter-checks.log
          if-no-files-found: error
          retention-days: 14

  aa_native:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'aa_native' &&
      github.ref == 'refs/heads/codex/implementation-workflow-checks-1026ag'
    runs-on: windows-2022
    timeout-minutes: 105
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CI_SUITE: changed_revisions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install retained hash-pinned dependency
        shell: pwsh
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-aa-dependencies' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r .ci/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run fixed verifier against authenticated AA inputs
        shell: pwsh
        env:
          PTK_FIXTURE_KEY: ${{ secrets.PTK_FIXTURE_KEY }}
          PTK_ABILITY_EXCHANGE_POLICY_B64: ${{ secrets.PTK_ABILITY_EXCHANGE_POLICY_B64 }}
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-aa-native' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 tools/ci_validate.py --root "$env:GITHUB_WORKSPACE" --suite "$env:CI_SUITE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskSummaries = @(Get-ChildItem -Path output/ci/*/summary.json)
          if ($taskSummaries.Count -ne 1) { throw 'One original native summary is required' }
          $taskSummary = Get-Content -LiteralPath $taskSummaries[0].FullName -Raw | ConvertFrom-Json
          $taskReport = @($taskSummary.reports)
          if ($taskReport.Count -ne 1 -or -not $taskReport[0].successful -or $taskReport[0].tests_run -ne 86 -or $taskReport[0].collected_count -ne 86 -or $taskReport[0].status_counts.pass -ne 86) {
            throw 'The whole 86-case AA and affected-boundary declaration did not pass'
          }
      - name: Preserve encrypted diagnostics and original physical evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-aa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci/*/run.json
            output/ci/*/summary.json
            output/ci/*/input-sha256.json
            output/ci/*/input-sha256-after.json
            output/ci/*/input-comparison.json
            output/ci/*/diagnostics.zip.enc
            output/ci/*/evidence.zip.enc
          if-no-files-found: error
          retention-days: 14
