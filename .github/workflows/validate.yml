name: Validate revisions

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Final required tests to run
        type: choice
        required: true
        default: final_revisions
        options:
          - final_revisions
          - all_revisions
          - common_checks
          - move_revisions
          - rank_revisions
          - retraining
          - next_revisions

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'common_checks' && '["common_checks"]' || inputs.suite == 'move_revisions' && '["move_revisions"]' || inputs.suite == 'rank_revisions' && '["rank_revisions"]' || inputs.suite == 'retraining' && '["retraining"]' || inputs.suite == 'next_revisions' && '["next_revisions"]' || '["final_revisions_01", "final_revisions_02", "final_revisions_03", "final_revisions_04", "final_revisions_05", "final_revisions_06", "final_revisions_07", "final_revisions_08", "final_revisions_09"]') }}
    name: ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 105
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CI_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Restore authenticated fixtures and run existing verifier
        shell: pwsh
        env:
          PTK_FIXTURE_KEY: ${{ secrets.PTK_FIXTURE_KEY }}
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, $env:CI_SUITE
          New-Item -ItemType Directory -Path $taskTemp -Force -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 tools/ci_validate.py --root "$env:GITHUB_WORKSPACE" --suite "$env:CI_SUITE"
      - name: Preserve this run's evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci/*/run.json
            output/ci/*/summary.json
            output/ci/*/input-sha256.json
            output/ci/*/input-sha256-after.json
            output/ci/*/input-comparison.json
            output/ci/*/evidence.zip.enc
          if-no-files-found: warn
          retention-days: 14
