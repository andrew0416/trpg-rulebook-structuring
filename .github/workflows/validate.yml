name: Validate revisions

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Validation scope (diagnose_existing never reruns native tests)
        type: choice
        required: true
        default: changed_revisions
        options:
          - changed_revisions
          - prepare_reviewed_controls
          - diagnose_existing
          - metadata_prerequisites
          - final_revisions
          - performance_probe
          - repair_revisions
          - all_revisions
          - metadata_revisions
          - typed_revisions
          - frequency_equivalence
          - procedural_runners
          - common_checks
          - move_revisions
          - rank_revisions
          - retraining
          - next_revisions

      expected_parent:
        description: Exact current codex branch head for prepare_reviewed_controls only
        type: string
        required: false
permissions:
  contents: read

jobs:
  prepare_controls:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'prepare_reviewed_controls' &&
      startsWith(github.ref, 'refs/heads/codex/')
    runs-on: windows-2022
    timeout-minutes: 15
    concurrency:
      group: prepare-reviewed-controls-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      prepared_commit: ${{ steps.controls.outputs.prepared_commit }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_parent }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Prepare and commit only reviewed CI controls
        id: controls
        shell: pwsh
        env:
          REVIEWED_PARENT: ${{ inputs.expected_parent }}
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-control-preparation' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -Force -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 tools/ci_prepare_reviewed_controls.py --root "$env:GITHUB_WORKSPACE" --expected-parent "$env:REVIEWED_PARENT"
  diagnose_existing:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'diagnose_existing' &&
      startsWith(github.ref, 'refs/heads/codex/')
    runs-on: windows-2022
    timeout-minutes: 10
    concurrency:
      group: diagnose-fixed-40334904411-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CI_SUITE: diagnose_existing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Read only the fixed failed run's authenticated small diagnostic
        shell: pwsh
        env:
          PTK_FIXTURE_KEY: ${{ secrets.PTK_FIXTURE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-existing-diagnostic' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -Force -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 tools/ci_diagnose_existing.py --root "$env:GITHUB_WORKSPACE"
      - name: Preserve only the allowlisted diagnostic summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: existing-diagnostic-40334904411-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/existing-diagnostic/summary.json
          if-no-files-found: warn
          retention-days: 14
  validate:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.suite != 'prepare_reviewed_controls' &&
      inputs.suite != 'diagnose_existing' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'metadata_prerequisites' && '["repair_revisions_01","frequency_equivalence"]' || inputs.suite == 'changed_revisions' && '["changed_revisions"]' || inputs.suite == 'performance_probe' && '["performance_probe"]' || inputs.suite == 'metadata_revisions' && '["metadata_revisions","procedural_22"]' || inputs.suite == 'all_revisions' && '["final_revisions_01","final_revisions_02","final_revisions_03","final_revisions_04","final_revisions_05","final_revisions_06","final_revisions_07","final_revisions_08","final_revisions_09","final_revisions_10","final_revisions_11","final_revisions_12","final_revisions_13","final_revisions_14","final_revisions_15","final_revisions_16","final_revisions_17","final_revisions_18","frequency_equivalence","procedural_01","procedural_02","procedural_03","procedural_04","procedural_05","procedural_06","procedural_07","procedural_08","procedural_09","procedural_10","procedural_11","procedural_12","procedural_13","procedural_14","procedural_15","procedural_16","procedural_17","procedural_18","procedural_19","procedural_20","procedural_21"]' || inputs.suite == 'typed_revisions' && '["frequency_equivalence","procedural_01","procedural_02","procedural_03","procedural_04","procedural_05","procedural_06","procedural_07","procedural_08","procedural_09","procedural_10","procedural_11","procedural_12","procedural_13","procedural_14","procedural_15","procedural_16","procedural_17","procedural_18","procedural_19","procedural_20","procedural_21"]' || inputs.suite == 'frequency_equivalence' && '["frequency_equivalence"]' || inputs.suite == 'procedural_runners' && '["procedural_01","procedural_02","procedural_03","procedural_04","procedural_05","procedural_06","procedural_07","procedural_08","procedural_09","procedural_10","procedural_11","procedural_12","procedural_13","procedural_14","procedural_15","procedural_16","procedural_17","procedural_18","procedural_19","procedural_20","procedural_21"]' || inputs.suite == 'repair_revisions' && '["repair_revisions_01", "repair_revisions_02", "repair_revisions_03", "repair_revisions_04", "repair_revisions_05", "repair_revisions_06", "repair_revisions_07", "repair_revisions_08", "repair_revisions_09"]' || inputs.suite == 'common_checks' && '["common_checks"]' || inputs.suite == 'move_revisions' && '["move_revisions"]' || inputs.suite == 'rank_revisions' && '["rank_revisions"]' || inputs.suite == 'retraining' && '["retraining"]' || inputs.suite == 'next_revisions' && '["next_revisions"]' || '["final_revisions_01", "final_revisions_02", "final_revisions_03", "final_revisions_04", "final_revisions_05", "final_revisions_06", "final_revisions_07", "final_revisions_08", "final_revisions_09", "final_revisions_10", "final_revisions_11", "final_revisions_12", "final_revisions_13", "final_revisions_14", "final_revisions_15", "final_revisions_16", "final_revisions_17", "final_revisions_18"]') }}
    name: ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 105
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CI_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install hash-pinned test dependency
        shell: pwsh
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-{2}-dependencies' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, $env:CI_SUITE
          New-Item -ItemType Directory -Path $taskTemp -Force -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r .ci/requirements.txt
      - name: Restore authenticated fixtures and run existing verifier
        shell: pwsh
        env:
          PTK_FIXTURE_KEY: ${{ secrets.PTK_FIXTURE_KEY }}
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, $env:CI_SUITE
          New-Item -ItemType Directory -Path $taskTemp -Force -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 tools/ci_validate.py --root "$env:GITHUB_WORKSPACE" --suite "$env:CI_SUITE"
      - name: Check original ordinary evidence with unchanged independent H
        if: ${{ always() && matrix.suite == 'changed_revisions' }}
        shell: pwsh
        env:
          PTK_FIXTURE_KEY: ${{ secrets.PTK_FIXTURE_KEY }}
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-independent-h' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -Force -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 tools/ci_remote_h.py --root "$env:GITHUB_WORKSPACE"
      - name: Preserve small encrypted diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci/*/run.json
            output/ci/*/summary.json
            output/ci/*/diagnostics.zip.enc
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve this run's evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci/*/run.json
            output/ci/*/summary.json
            output/ci/*/input-sha256.json
            output/ci/*/input-sha256-after.json
            output/ci/*/input-comparison.json
            output/ci/*/evidence.zip.enc
            output/ci/remote-h/h-summary.json
            output/ci/remote-h/h-proof.json.enc
          if-no-files-found: warn
          retention-days: 14
