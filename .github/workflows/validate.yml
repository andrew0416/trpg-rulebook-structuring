name: Validate integrated revisions and implementation workflow

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Select one reviewed validation or historical diagnostic route; no clause credit
        type: choice
        required: true
        default: workflow_checks
        options:
          - workflow_checks
          - ci_adapter_checks
          - aa_native
          - aa_diagnostics
          - changed_revisions
          - prepare_reviewed_controls
          - diagnose_existing
          - metadata_prerequisites
          - final_revisions
          - performance_probe
          - repair_revisions
          - all_revisions
          - metadata_revisions
          - typed_revisions
          - frequency_equivalence
          - procedural_runners
          - common_checks
          - move_revisions
          - rank_revisions
          - retraining
          - next_revisions

      expected_parent:
        description: Exact current codex branch head for prepare_reviewed_controls only
        type: string
        required: false

permissions:
  contents: read

jobs:
  prepare_controls:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'prepare_reviewed_controls' &&
      startsWith(github.ref, 'refs/heads/codex/')
    runs-on: windows-2022
    timeout-minutes: 15
    concurrency:
      group: prepare-reviewed-controls-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      prepared_commit: ${{ steps.controls.outputs.prepared_commit }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_parent }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Prepare and commit only reviewed CI controls
        id: controls
        shell: pwsh
        env:
          REVIEWED_PARENT: ${{ inputs.expected_parent }}
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-control-preparation' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -Force -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 tools/ci_prepare_reviewed_controls.py --root "$env:GITHUB_WORKSPACE" --expected-parent "$env:REVIEWED_PARENT"

  diagnose_existing:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'diagnose_existing' &&
      startsWith(github.ref, 'refs/heads/codex/')
    runs-on: windows-2022
    timeout-minutes: 10
    concurrency:
      group: diagnose-fixed-40363272171-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CI_SUITE: diagnose_existing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Read only the fixed failed run's authenticated small diagnostic
        shell: pwsh
        env:
          PTK_FIXTURE_KEY: ${{ secrets.PTK_FIXTURE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-existing-diagnostic' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -Force -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 tools/ci_diagnose_existing.py --root "$env:GITHUB_WORKSPACE"
      - name: Preserve only the allowlisted diagnostic summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: existing-diagnostic-40363272171-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/existing-diagnostic/summary.json
          if-no-files-found: warn
          retention-days: 14

  validate:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["changed_revisions","metadata_prerequisites","final_revisions","performance_probe","repair_revisions","all_revisions","metadata_revisions","typed_revisions","frequency_equivalence","procedural_runners","common_checks","move_revisions","rank_revisions","retraining","next_revisions"]'), inputs.suite) &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'metadata_prerequisites' && '["repair_revisions_01","frequency_equivalence"]' || inputs.suite == 'changed_revisions' && '["changed_revisions"]' || inputs.suite == 'performance_probe' && '["performance_probe"]' || inputs.suite == 'metadata_revisions' && '["metadata_revisions","procedural_22"]' || inputs.suite == 'all_revisions' && '["final_revisions_01","final_revisions_02","final_revisions_03","final_revisions_04","final_revisions_05","final_revisions_06","final_revisions_07","final_revisions_08","final_revisions_09","final_revisions_10","final_revisions_11","final_revisions_12","final_revisions_13","final_revisions_14","final_revisions_15","final_revisions_16","final_revisions_17","final_revisions_18","frequency_equivalence","procedural_01","procedural_02","procedural_03","procedural_04","procedural_05","procedural_06","procedural_07","procedural_08","procedural_09","procedural_10","procedural_11","procedural_12","procedural_13","procedural_14","procedural_15","procedural_16","procedural_17","procedural_18","procedural_19","procedural_20","procedural_21"]' || inputs.suite == 'typed_revisions' && '["frequency_equivalence","procedural_01","procedural_02","procedural_03","procedural_04","procedural_05","procedural_06","procedural_07","procedural_08","procedural_09","procedural_10","procedural_11","procedural_12","procedural_13","procedural_14","procedural_15","procedural_16","procedural_17","procedural_18","procedural_19","procedural_20","procedural_21"]' || inputs.suite == 'frequency_equivalence' && '["frequency_equivalence"]' || inputs.suite == 'procedural_runners' && '["procedural_01","procedural_02","procedural_03","procedural_04","procedural_05","procedural_06","procedural_07","procedural_08","procedural_09","procedural_10","procedural_11","procedural_12","procedural_13","procedural_14","procedural_15","procedural_16","procedural_17","procedural_18","procedural_19","procedural_20","procedural_21"]' || inputs.suite == 'repair_revisions' && '["repair_revisions_01", "repair_revisions_02", "repair_revisions_03", "repair_revisions_04", "repair_revisions_05", "repair_revisions_06", "repair_revisions_07", "repair_revisions_08", "repair_revisions_09"]' || inputs.suite == 'common_checks' && '["common_checks"]' || inputs.suite == 'move_revisions' && '["move_revisions"]' || inputs.suite == 'rank_revisions' && '["rank_revisions"]' || inputs.suite == 'retraining' && '["retraining"]' || inputs.suite == 'next_revisions' && '["next_revisions"]' || '["final_revisions_01", "final_revisions_02", "final_revisions_03", "final_revisions_04", "final_revisions_05", "final_revisions_06", "final_revisions_07", "final_revisions_08", "final_revisions_09", "final_revisions_10", "final_revisions_11", "final_revisions_12", "final_revisions_13", "final_revisions_14", "final_revisions_15", "final_revisions_16", "final_revisions_17", "final_revisions_18"]') }}
    name: ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 105
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CI_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install hash-pinned test dependency
        shell: pwsh
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-{2}-dependencies' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, $env:CI_SUITE
          New-Item -ItemType Directory -Path $taskTemp -Force -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r .ci/requirements.txt
      - name: Restore authenticated fixtures and run existing verifier
        shell: pwsh
        env:
          PTK_FIXTURE_KEY: ${{ secrets.PTK_FIXTURE_KEY }}
          PTK_ABILITY_EXCHANGE_POLICY_B64: ${{ secrets.PTK_ABILITY_EXCHANGE_POLICY_B64 }}
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, $env:CI_SUITE
          New-Item -ItemType Directory -Path $taskTemp -Force -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 tools/ci_validate.py --root "$env:GITHUB_WORKSPACE" --suite "$env:CI_SUITE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:CI_SUITE -ceq 'changed_revisions') {
            $taskSummaries = @(Get-ChildItem -Path output/ci/*/summary.json)
            if ($taskSummaries.Count -ne 1) { throw 'One original native summary is required' }
            $taskSummary = Get-Content -LiteralPath $taskSummaries[0].FullName -Raw | ConvertFrom-Json
            $taskReport = @($taskSummary.reports)
            if ($taskReport.Count -ne 1 -or -not $taskReport[0].successful -or $taskReport[0].tests_run -ne 667 -or $taskReport[0].collected_count -ne 667 -or $taskReport[0].status_counts.pass -ne 667) {
              throw 'The whole 667-case retained integration and published restoration declaration did not pass'
            }
          }
      - name: Check original ordinary evidence with unchanged independent H
        if: ${{ always() && matrix.suite == 'changed_revisions' }}
        shell: pwsh
        env:
          PTK_FIXTURE_KEY: ${{ secrets.PTK_FIXTURE_KEY }}
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-independent-h' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -Force -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 tools/ci_remote_h.py --root "$env:GITHUB_WORKSPACE"
      - name: Preserve small encrypted diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci/*/run.json
            output/ci/*/summary.json
            output/ci/*/diagnostics.zip.enc
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve this run's evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci/*/run.json
            output/ci/*/summary.json
            output/ci/*/input-sha256.json
            output/ci/*/input-sha256-after.json
            output/ci/*/input-comparison.json
            output/ci/*/evidence.zip.enc
            output/ci/remote-h/h-summary.json
            output/ci/remote-h/h-proof.json.enc
          if-no-files-found: warn
          retention-days: 14

  workflow_checks:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'workflow_checks' &&
      startsWith(github.ref, 'refs/heads/codex/implementation-workflow-')
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run unchanged synthetic tooling regressions
        shell: pwsh
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-workflow-checks' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $taskCode = @'
          from hashlib import sha256
          import json, os
          from pathlib import Path
          import sys, unittest
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          if root.drive.upper() != 'D:':
              raise RuntimeError('Synthetic test outputs must remain on D:')
          names = ['acceptance_evidence.py', 'reconcile_batch.py', 'audit_vault_quality.py',
                   'verify_ordered_core.py', 'test_acceptance_capture.py',
                   'test_reconcile_csv_core.py', 'test_verify_ordered_publication.py']
          paths = ['work/reuse-partials/' + name for name in names] + ['tools/report_category2_progress.py']
          before = {name: sha256((root/name).read_bytes()).hexdigest() for name in paths}
          sys.path.insert(0, str(root/'work/reuse-partials'))
          import reconcile_batch
          reconcile_batch.R = root
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'test_acceptance_capture', 'test_reconcile_csv_core', 'test_verify_ordered_publication'])
          declared = suite.countTestCases()
          if declared != 75:
              raise RuntimeError(f'Expected the retained 74 plus one module-name regression, got {declared}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          after = {name: sha256((root/name).read_bytes()).hexdigest() for name in paths}
          passed = result.wasSuccessful() and result.testsRun == declared and before == after
          evidence = dict(scope='synthetic_tooling_only', clause_credit=0, game_runs=0,
                          git_sha=os.environ['GITHUB_SHA'], declared=declared, ran=result.testsRun,
                          failures=len(result.failures), errors=len(result.errors),
                          skipped=len(result.skipped), passed=passed,
                          input_sha256=before, inputs_unchanged=before == after)
          with (root/'workflow-checks.json').open('x', encoding='utf-8') as stream:
              json.dump(evidence, stream, ensure_ascii=False, indent=2)
          raise SystemExit(0 if passed else 1)
          '@
          python -B -X utf8 -c $taskCode 2>&1 | Tee-Object -FilePath workflow-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve synthetic checks and exact source pins
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-workflow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workflow-checks.json
            workflow-checks.log
          if-no-files-found: error
          retention-days: 14

  ci_adapter_checks:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'ci_adapter_checks' &&
      startsWith(github.ref, 'refs/heads/codex/implementation-workflow-')
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run retained adapter self-check with synthetic private-policy boundaries
        shell: pwsh
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-adapter-checks' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          $taskPaths = @('tools/ci_validate.py', 'tools/ci_physical.py', 'tools/ci_physical_selfcheck.py', 'tools/ci_fixtures.mjs')
          $taskBefore = [ordered]@{}
          foreach ($taskPath in $taskPaths) { $taskBefore[$taskPath] = (Get-FileHash -Algorithm SHA256 -LiteralPath $taskPath).Hash.ToLowerInvariant() }
          $taskClock = [Diagnostics.Stopwatch]::StartNew()
          python -B -X utf8 tools/ci_validate.py --self-check 2>&1 | Tee-Object -FilePath ci-adapter-checks.log
          $taskExit = $LASTEXITCODE
          $taskClock.Stop()
          $taskAfter = [ordered]@{}
          foreach ($taskPath in $taskPaths) { $taskAfter[$taskPath] = (Get-FileHash -Algorithm SHA256 -LiteralPath $taskPath).Hash.ToLowerInvariant() }
          $taskUnchanged = ($taskBefore | ConvertTo-Json -Compress) -ceq ($taskAfter | ConvertTo-Json -Compress)
          $taskResult = [ordered]@{
            scope = 'synthetic_ci_adapter_self_check_only'
            clause_credit = 0
            game_runs = 0
            actual_private_policy_used = $false
            git_sha = $env:GITHUB_SHA
            exit_code = $taskExit
            elapsed_seconds = $taskClock.Elapsed.TotalSeconds
            input_sha256 = $taskBefore
            inputs_unchanged = $taskUnchanged
            passed = ($taskExit -eq 0 -and $taskUnchanged)
          }
          $taskResult | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath ci-adapter-checks.json -Encoding utf8NoBOM
          if (-not $taskResult.passed) { exit 1 }
      - name: Preserve synthetic adapter result and exact source pins
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-adapter-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-adapter-checks.json
            ci-adapter-checks.log
          if-no-files-found: error
          retention-days: 14

  aa_native:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'aa_native' &&
      github.ref == 'refs/heads/codex/implementation-workflow-checks-1026ag'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CI_SUITE: changed_revisions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install retained hash-pinned dependency
        shell: pwsh
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-aa-dependencies' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r .ci/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check source preparation boundaries separately from native evidence
        shell: pwsh
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-source-preparation-checks' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 -m unittest tools.test_ci_prepare_marksman_source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run fixed verifier against authenticated AA inputs
        shell: pwsh
        env:
          PTK_FIXTURE_KEY: ${{ secrets.PTK_FIXTURE_KEY }}
          PTK_ABILITY_EXCHANGE_POLICY_B64: ${{ secrets.PTK_ABILITY_EXCHANGE_POLICY_B64 }}
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-aa-native' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 tools/ci_validate.py --root "$env:GITHUB_WORKSPACE" --suite "$env:CI_SUITE" --native-timeout-seconds 1800
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskSummaries = @(Get-ChildItem -Path output/ci/*/summary.json)
          if ($taskSummaries.Count -ne 1) { throw 'One original native summary is required' }
          $taskSummary = Get-Content -LiteralPath $taskSummaries[0].FullName -Raw | ConvertFrom-Json
          $taskReport = @($taskSummary.reports)
          if ($taskReport.Count -ne 1 -or -not $taskReport[0].successful -or $taskReport[0].tests_run -ne 18 -or $taskReport[0].collected_count -ne 18 -or $taskReport[0].status_counts.pass -ne 18) {
            throw 'The exact 18-case diagnostic reproduction subset did not pass; full667 and pending1192 are not completed by this run'
          }
      - name: Check original ordinary evidence with unchanged independent H
        if: ${{ always() }}
        shell: pwsh
        env:
          PTK_FIXTURE_KEY: ${{ secrets.PTK_FIXTURE_KEY }}
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-independent-h' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -Force -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          python -B -X utf8 tools/ci_remote_h.py --root "$env:GITHUB_WORKSPACE"
      - name: Preserve encrypted diagnostics and original physical evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-aa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci/*/run.json
            output/ci/*/summary.json
            output/ci/*/input-sha256.json
            output/ci/*/input-sha256-after.json
            output/ci/*/input-comparison.json
            output/ci/*/diagnostics.zip.enc
            output/ci/*/evidence.zip.enc
            output/ci/remote-h/h-summary.json
            output/ci/remote-h/h-proof.json.enc
          if-no-files-found: error
          retention-days: 14

  aa_diagnostics:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.suite == 'aa_diagnostics' &&
      github.ref == 'refs/heads/codex/implementation-workflow-checks-1026ag'
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Download only the bound original timeout artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-aa-diagnostics' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -ErrorAction Stop | Out-Null
          $taskHeaders = @{ Authorization = 'Bearer ' + $env:GH_TOKEN; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $taskApi = 'https://api.github.com/repos/andrew0416/trpg-rulebook-structuring'
          $taskRun = Invoke-RestMethod -Uri ($taskApi + '/actions/runs/40464302678') -Headers $taskHeaders
          if ($taskRun.head_sha -cne 'b1204a91b405bbe7ffa2dac0189150f4ecbe0251' -or $taskRun.status -cne 'completed' -or $taskRun.conclusion -cne 'failure' -or $taskRun.run_attempt -ne 1) { throw 'Original run binding differs' }
          $taskJob = Invoke-RestMethod -Uri ($taskApi + '/actions/jobs/122055937438') -Headers $taskHeaders
          if ($taskJob.id -ne 122055937438 -or $taskJob.run_id -ne 40464302678 -or $taskJob.head_sha -cne $taskRun.head_sha -or $taskJob.status -cne 'completed' -or $taskJob.conclusion -cne 'failure') { throw 'Original job binding differs' }
          $taskArtifact = Invoke-RestMethod -Uri ($taskApi + '/actions/artifacts/12718918675') -Headers $taskHeaders
          if ($taskArtifact.name -cne 'implementation-aa-40464302678-1' -or $taskArtifact.size_in_bytes -ne 213686508 -or $taskArtifact.expired -or $taskArtifact.workflow_run.id -ne 40464302678 -or $taskArtifact.workflow_run.head_sha -cne $taskRun.head_sha -or $taskArtifact.digest -cne 'sha256:6ba028210d34fe786d81e016c1f3f4e2e23fa56d3418cb6da8067231f04bebb2') { throw 'Original artifact binding differs' }
          $taskZip = Join-Path $taskTemp 'original-artifact.zip'
          Invoke-WebRequest -Uri ($taskApi + '/actions/artifacts/12718918675/zip') -Headers $taskHeaders -OutFile $taskZip
          if ((Get-Item -LiteralPath $taskZip).Length -ne 213686508) { throw 'Original artifact size differs' }
          $taskArchive = [IO.Compression.ZipFile]::OpenRead($taskZip)
          try {
            $taskPrefix = 'b80b2ff9e1c2403fa2a629134eade2f7/'
            $taskExpected = @{
              ($taskPrefix + 'diagnostics.zip.enc') = 311169
              ($taskPrefix + 'evidence.zip.enc') = 212983746
              ($taskPrefix + 'input-comparison.json') = 68
              ($taskPrefix + 'input-sha256-after.json') = 383170
              ($taskPrefix + 'input-sha256.json') = 383170
              ($taskPrefix + 'run.json') = 4897
              ($taskPrefix + 'summary.json') = 157
              'remote-h/h-proof.json.enc' = 739
              'remote-h/h-summary.json' = 427
            }
            if ($taskArchive.Entries.Count -ne 9) { throw 'Original artifact shape differs' }
            $taskSeen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            foreach ($taskEntry in $taskArchive.Entries) {
              if (-not $taskSeen.Add($taskEntry.FullName) -or -not ($taskExpected.Keys -ccontains $taskEntry.FullName) -or $taskEntry.Length -ne $taskExpected[$taskEntry.FullName]) { throw 'Original artifact shape differs' }
            }
            $taskEntries = @($taskArchive.Entries | Where-Object { $_.FullName -ceq ($taskPrefix + 'diagnostics.zip.enc') })
            if ($taskEntries.Count -ne 1 -or $taskEntries[0].Length -ne 311169) { throw 'One bound encrypted diagnostic is required' }
            $taskInput = $taskEntries[0].Open()
            $taskOutput = [IO.File]::Open((Join-Path $taskTemp 'diagnostics.zip.enc'), [IO.FileMode]::CreateNew)
            try { $taskInput.CopyTo($taskOutput) } finally { $taskOutput.Dispose(); $taskInput.Dispose() }
          } finally { $taskArchive.Dispose() }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $taskTemp 'diagnostics.zip.enc')).Hash.ToLowerInvariant() -cne '9bfaabd0cd68cc8605e49462a8915b10627839aac47ae29634842b16bfed2822') { throw 'Encrypted diagnostic digest differs' }
      - name: Reduce original timeout logs to allowlisted public ID observations only
        shell: pwsh
        env:
          PTK_FIXTURE_KEY: ${{ secrets.PTK_FIXTURE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-aa-diagnostics' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $env:RUNNER_TEMP = $taskTemp
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath tools/ci_fixtures.mjs).Hash.ToLowerInvariant() -cne 'd885b3bd8947b7a66ba4146b49d210b24dde1fdb1fa3c415c0ac1f24182d2f90') { throw 'Retained crypto helper changed' }
          try {
            node tools/ci_fixtures.mjs decrypt (Join-Path $taskTemp 'diagnostics.zip.enc') (Join-Path $taskTemp 'diagnostics.zip')
            if ($LASTEXITCODE -ne 0) { throw 'Authenticated diagnostic decryption failed' }
          } finally { Remove-Item Env:PTK_FIXTURE_KEY -ErrorAction SilentlyContinue }
          $taskCode = @'
          import hashlib, json, os, re, subprocess, zipfile
          from pathlib import Path

          def main():
              root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
              temporary = Path(os.environ['RUNNER_TEMP']).resolve()
              if root.drive.upper() != 'D:' or temporary.drive.upper() != 'D:':
                  raise ValueError('D-only diagnostic paths required')
              head = 'b1204a91b405bbe7ffa2dac0189150f4ecbe0251'
              evidence_id = 'b80b2ff9e1c2403fa2a629134eade2f7'
              def git(*args):
                  return subprocess.check_output(['git', *args], cwd=root, stderr=subprocess.DEVNULL)
              if git('rev-parse', 'HEAD^').decode().strip() != head:
                  raise ValueError('The diagnostic proposal must directly follow its bound source')
              if git('diff', '--name-only', head, 'HEAD').decode().splitlines() != ['.github/workflows/validate.yml']:
                  raise ValueError('Only the diagnostic workflow may change before this read')
              packet_blob = '6d8b0a8dc53a2784393350c81de3d63ca3a4b4e4'
              if git('rev-parse', head + ':.ci/suites/changed_revisions.json').decode().strip() != packet_blob:
                  raise ValueError('Original public packet Git object differs')
              packet_bytes = git('show', head + ':.ci/suites/changed_revisions.json')
              packet = json.loads(packet_bytes)
              declared = [name for group, row in packet['completed'].items() for name in row['tests']
                          if isinstance(name, str) and name.startswith(group + '.')]
              public_ids = set(declared)
              if (len(declared) != 667 or len(public_ids) != 667 or packet['required_unique_count'] != 667
                      or sum(len(row['tests']) for row in packet['completed'].values()) != 667
                      or packet['completion_credit'] != 0
                      or any(re.fullmatch(r'(?:tools|tests)\.[A-Za-z0-9_]+(?:\.[A-Za-z0-9_]+)+\.test_[A-Za-z0-9_]+', name) is None for name in declared)):
                  raise ValueError('Original public declaration differs')
              outer_shape = {evidence_id + '/' + name: size for name, size in {
                  'diagnostics.zip.enc': 311169, 'evidence.zip.enc': 212983746,
                  'input-comparison.json': 68, 'input-sha256-after.json': 383170,
                  'input-sha256.json': 383170, 'run.json': 4897, 'summary.json': 157}.items()}
              outer_shape.update({'remote-h/h-proof.json.enc': 739, 'remote-h/h-summary.json': 427})
              def shape(archive, expected):
                  entries = archive.infolist()
                  if len(entries) != len(expected) or {item.filename for item in entries} != set(expected):
                      raise ValueError('Bound original archive shape differs')
                  if any(item.file_size != expected[item.filename] or item.is_dir() or item.flag_bits & 1
                         or (item.external_attr >> 16) & 0o170000 == 0o120000 for item in entries):
                      raise ValueError('Bound original archive member differs')
              with zipfile.ZipFile(temporary / 'original-artifact.zip') as archive:
                  shape(archive, outer_shape)
                  def metadata(name):
                      return json.loads(archive.read(evidence_id + '/' + name))
                  summary = metadata('summary.json')
                  run = metadata('run.json')
                  comparison = metadata('input-comparison.json')
                  before = metadata('input-sha256.json')
                  after = metadata('input-sha256-after.json')
                  h_summary = json.loads(archive.read('remote-h/h-summary.json'))
              if summary != dict(schema_version=1, suite='changed_revisions', report_count=0,
                                 verifier_status='timeout', verifier_exit_code=124, reports=[]):
                  raise ValueError('Original no-report timeout summary differs')
              if (comparison != dict(unchanged=True, changed_paths=[], read_errors={})
                      or not isinstance(before, dict) or not before or before != after
                      or any(not isinstance(name, str) or not isinstance(sha, str) or re.fullmatch(r'[0-9a-f]{64}', sha) is None for name, sha in before.items())):
                  raise ValueError('Original authenticated input comparison differs')
              for path in ('.ci/suites/changed_revisions.json', 'work/reuse-partials/verify_overlay_tests.py', 'tools/ci_physical.py', 'tools/ci_fixtures.mjs'):
                  if before.get(path) != hashlib.sha256(git('show', head + ':' + path)).hexdigest():
                      raise ValueError('Original frozen public input differs')
              if before['.ci/suites/changed_revisions.json'] != hashlib.sha256(packet_bytes).hexdigest():
                  raise ValueError('Original frozen packet differs')
              full_evidence = dict(file='evidence.zip.enc', sha256='acc5823d486990bded62f7f95c2cd3d671fb677c7fcf5662a7ad1f06a8184830', raw_file_count=10)
              small_evidence = dict(file='diagnostics.zip.enc', sha256='9bfaabd0cd68cc8605e49462a8915b10627839aac47ae29634842b16bfed2822', raw_file_count=9, complete_input_capture=False)
              outcome = run['verifier_outcome']
              stage = 'D:/trpg-rulebook-structuring/ci/40464302678-1-changed_revisions'
              command = outcome['command']
              normalized = [value.replace('\\', '/') for value in command] if isinstance(command, list) and all(isinstance(value, str) for value in command) else []
              if (run['git_sha'] != head or run['evidence_id'] != evidence_id or run['suite'] != 'changed_revisions'
                      or run['status'] != 'timeout' or run['exit_code'] != 124 or run['native_timeout_seconds'] != 5400
                      or run['inputs_unchanged'] is not True or run['evidence_status'] != 'encrypted'
                      or run['marksman_source_preparation']['status'] != 'prepared' or run['marksman_source_preparation']['page_index'] != 329
                      or outcome['status'] != 'timeout' or outcome['exit_code'] != 124 or outcome['elapsed_seconds'] != 5400.672
                      or run['execution_stage'].replace('\\', '/') != stage
                      or run['ci']['GITHUB_SHA'] != head or run['ci']['GITHUB_RUN_ID'] != '40464302678' or run['ci']['GITHUB_RUN_ATTEMPT'] != '1'
                      or run['encrypted_evidence'] != dict(full_evidence, diagnostics=small_evidence)
                      or len(normalized) != 14 or normalized[1:8] != ['-B', '-u', '-X', 'utf8', stage + '/tools/ci_physical.py', '--stage', stage]
                      or normalized[8] != '--inputs' or normalized[9] != normalized[13] + '/input-sha256.json'
                      or normalized[10:13] != ['--target', '.ci/suites/changed_revisions.json', '--output']
                      or not normalized[13].endswith('/output/ci/' + evidence_id)):
                  raise ValueError('Original timeout execution binding differs')
              if h_summary != dict(status='H_REJECTED', run='40464302678', attempt='1', head=head,
                                   suite='changed_revisions', checker_sha256='8df797f3faf505643e68ce05148d4ba3af36d47efe72ed08a0ef72aa5bd4ce07',
                                   ordinary_verified=0, native_runs=0, completion_credit=0,
                                   encrypted_h_proof_sha256='5384a0d56076d10fe58636acdb3d83bc6d17043ca8392a04150f0bfcd1b827e2'):
                  raise ValueError('Original rejected H binding differs')

              result_tokens = ('ok', 'FAIL', 'ERROR', 'expected failure', 'unexpected success')
              header = re.compile(r'(test_[A-Za-z0-9_]+) \(((?:tools|tests)\.[A-Za-z0-9_.]+)\)(?: \.\.\.(?: (ok|FAIL|ERROR|expected failure|unexpected success))?)?')
              def reduce(text):
                  starts, results = [], {token: [] for token in result_tokens}
                  for line in text.splitlines():
                      match = header.fullmatch(line.rstrip(' \t')) if len(line) <= 4096 else None
                      if not match or match[2] not in public_ids or match[1] != match[2].rsplit('.', 1)[1]:
                          continue
                      starts.append(match[2])
                      if match[3] is not None:
                          results[match[3]].append(match[2])
                  ended = {name for values in results.values() for name in values}
                  return dict(public_start_row_count=len(starts), public_result_row_count=sum(map(len, results.values())),
                              unique_public_start_count=len(set(starts)), started_public_ids=sorted(set(starts)),
                              observed_result_token_counts={token: len(values) for token, values in results.items()},
                              observed_result_public_ids={token: sorted(set(values)) for token, values in results.items()},
                              last_public_test_id_observed=starts[-1] if starts else None,
                              started_without_result_token_public_ids=sorted(set(starts) - ended))
              marker = 'PRIVATE_VALUE_MUST_NOT_LEAVE'
              case = sorted(public_ids)[0]
              label = case.rsplit('.', 1)[1] + ' (' + case + ')'
              sample = reduce(label + ' ... ok\n' + label + ' ...\n' + label + '\n'
                              + label + ' (value=' + marker + ') ... FAIL\n'
                              + label + ' ... ERROR: ' + marker + '\n' + marker + label + ' ... ok\n'
                              + 'test_private (tools.private.Case.test_private) ... ok\nValueError: ' + marker)
              assert sample['public_start_row_count'] == 3 and sample['public_result_row_count'] == 1
              assert sample['started_public_ids'] == [case] and sample['observed_result_public_ids']['ok'] == [case]
              assert sample['last_public_test_id_observed'] == case and marker not in json.dumps(sample)
              assert not reduce(marker)['started_public_ids'] and not reduce(label + ' ... ok ' + marker)['started_public_ids']
              assert not reduce('test_other (' + case + ') ... ok')['started_public_ids']
              for token in result_tokens:
                  assert reduce(label + ' ... ' + token)['observed_result_public_ids'][token] == [case]
              for trailing in (' ', '\t'):
                  unfinished = reduce(label + ' ...' + trailing)
                  assert unfinished['public_start_row_count'] == 1 and unfinished['public_result_row_count'] == 0
                  assert unfinished['last_public_test_id_observed'] == case
                  assert not reduce(label + ' ... ' + marker + trailing)['started_public_ids']
              assert reduce(label + ' ... \nok')['public_result_row_count'] == 0
              assert reduce('')['last_public_test_id_observed'] is None

              # shortcut: this exact retained timeout only; review bindings before another run.
              with zipfile.ZipFile(temporary / 'diagnostics.zip') as archive:
                  entries = archive.infolist()
                  names = [item.filename for item in entries]
                  verifier_logs = [name for name in names if re.fullmatch(r'verifier/tests-[0-9a-f]{32}\.log', name)]
                  fixed = {'command.log', 'fixture-decrypt.log', 'marksman-source-parser.log',
                           'marksman-source-page-0329.log', 'marksman-source-candidate.log',
                           'marksman-source-provenance.log', 'physical/ci-native-events.jsonl',
                           'physical/ci-native-partial.log', 'diagnostic-scope.json'}
                  if (len(verifier_logs) != 1 or len(entries) != 10 or len(set(names)) != 10
                          or set(names) != fixed | set(verifier_logs)
                          or sum(item.file_size for item in entries) > 33554432
                          or any(item.is_dir() or item.flag_bits & 1 or (item.external_attr >> 16) & 0o170000 == 0o120000 for item in entries)):
                      raise ValueError('Bounded diagnostic archive required')
                  scope_info = archive.getinfo('diagnostic-scope.json')
                  if scope_info.file_size > 4096:
                      raise ValueError('Bounded diagnostic scope metadata required')
                  scope = json.loads(archive.read(scope_info))
                  if (set(scope) != {'schema_version', 'kind', 'complete_input_capture', 'full_evidence', 'excluded_input_archives'}
                          or scope['schema_version'] != 1 or scope['kind'] != 'diagnostic_only'
                          or scope['complete_input_capture'] is not False or scope['full_evidence'] != full_evidence
                          or set(scope['excluded_input_archives']) != {'physical/ci-native-inputs.zip'}
                          or re.fullmatch(r'[0-9a-f]{64}', scope['excluded_input_archives']['physical/ci-native-inputs.zip']) is None):
                      raise ValueError('Original diagnostic scope differs')
                  observations = {}
                  for key, name in (('command_log', 'command.log'), ('native_partial_log', 'physical/ci-native-partial.log')):
                      info = archive.getinfo(name)
                      if info.file_size > 8388608:
                          raise ValueError('Bounded explicit log member required')
                      observations[key] = reduce(archive.read(info).decode('utf-8'))
              result = dict(kind='redacted_original_timeout_observations_only', source_run=40464302678,
                            source_job=122055937438, source_attempt=1, declared_public_id_count=667,
                            original_public_packet_blob_oid=packet_blob,
                            source_commit=head, diagnostic_commit=os.environ['GITHUB_SHA'],
                            evidence_id=evidence_id, game_runs=0, native_reruns=0, verifier_reruns=0, h_reruns=0,
                            clause_credit=0, ordinary_verified=0, self_check_passed=True, physical_acceptance=False,
                            original_input_maps_compared_equal=True, original_h_status='H_REJECTED',
                            original_verifier_status='timeout', original_verifier_exit_code=124, original_report_count=0,
                            partial_verbose_observations_not_pass=True, execution_complete=False,
                            zero_observations_do_not_mean_zero_execution=True, log_observations_not_summed=True,
                            observations=observations)
              with (root / 'aa-diagnostics.json').open('x', encoding='utf-8') as stream:
                  json.dump(result, stream, ensure_ascii=False, indent=2)

          try:
              main()
          except BaseException:
              print('Bounded diagnostic reduction failed; raw evidence remains private.')
              raise SystemExit(1)
          print('Redacted original timeout observations saved; native/verifier/H reruns=0, clause credit=0.')
          '@
          python -I -B -X utf8 -c $taskCode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve only redacted public timeout observations
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-aa-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: aa-diagnostics.json
          if-no-files-found: error
          retention-days: 14
