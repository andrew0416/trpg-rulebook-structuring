name: Validate implementation workflow

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Synthetic acceptance/publication tooling only; no clause credit
        type: choice
        required: true
        default: workflow_checks
        options:
          - workflow_checks

permissions:
  contents: read

jobs:
  workflow_checks:
    if: >-
      github.repository == 'andrew0416/trpg-rulebook-structuring' &&
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/heads/codex/implementation-workflow-')
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run unchanged synthetic tooling regressions
        shell: pwsh
        run: |
          $taskTemp = 'D:\trpg-rulebook-structuring\ci-temp\{0}-{1}-workflow-checks' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          New-Item -ItemType Directory -Path $taskTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $taskTemp
          $env:TMP = $taskTemp
          $env:TMPDIR = $taskTemp
          $taskCode = @'
          from hashlib import sha256
          import json, os
          from pathlib import Path
          import sys, unittest
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          if root.drive.upper() != 'D:':
              raise RuntimeError('Synthetic test outputs must remain on D:')
          names = ['acceptance_evidence.py', 'reconcile_batch.py', 'audit_vault_quality.py',
                   'verify_ordered_core.py', 'test_acceptance_capture.py',
                   'test_reconcile_csv_core.py', 'test_verify_ordered_publication.py']
          paths = ['work/reuse-partials/' + name for name in names] + ['tools/report_category2_progress.py']
          before = {name: sha256((root/name).read_bytes()).hexdigest() for name in paths}
          sys.path.insert(0, str(root/'work/reuse-partials'))
          import reconcile_batch
          reconcile_batch.R = root
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'test_acceptance_capture', 'test_reconcile_csv_core', 'test_verify_ordered_publication'])
          declared = suite.countTestCases()
          if declared != 75:
              raise RuntimeError(f'Expected the retained 74 plus one module-name regression, got {declared}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          after = {name: sha256((root/name).read_bytes()).hexdigest() for name in paths}
          passed = result.wasSuccessful() and result.testsRun == declared and before == after
          evidence = dict(scope='synthetic_tooling_only', clause_credit=0, game_runs=0,
                          git_sha=os.environ['GITHUB_SHA'], declared=declared, ran=result.testsRun,
                          failures=len(result.failures), errors=len(result.errors),
                          skipped=len(result.skipped), passed=passed,
                          input_sha256=before, inputs_unchanged=before == after)
          with (root/'workflow-checks.json').open('x', encoding='utf-8') as stream:
              json.dump(evidence, stream, ensure_ascii=False, indent=2)
          raise SystemExit(0 if passed else 1)
          '@
          python -B -X utf8 -c $taskCode 2>&1 | Tee-Object -FilePath workflow-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve synthetic checks and exact source pins
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-workflow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workflow-checks.json
            workflow-checks.log
          if-no-files-found: error
          retention-days: 14
